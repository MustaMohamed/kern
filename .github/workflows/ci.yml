name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

# A newer run of the same event on the same ref cancels the older one. The event is in the group, so a
# push does not cancel the weekly macOS run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# scripts/ci-local runs the checks job's commands in the same order; tests/ci-local.test.mjs holds the two
# in step. Actions are pinned by commit SHA, with the tag it had beside it.
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Unit tests
        run: node --test 'tests/**/*.test.mjs'
      - name: Lint skills
        run: node scripts/lint-skills.mjs
      - name: Versions agree
        run: node scripts/check-version.mjs
      - name: Unreleased line for shipped changes
        if: github.event_name == 'pull_request'
        run: node scripts/check-version.mjs --pr origin/${{ github.base_ref }}
      - name: Routing evals
        run: node scripts/route-eval.mjs
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.296
      - name: Validate marketplace and plugin manifests
        run: |
          claude plugin validate . --strict
          claude plugin validate .claude-plugin/plugin.json --strict
      - name: Install bats and shellcheck
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck
      - name: Script tests
        run: tests/run-bats --jobs tests/scripts
      - name: Shellcheck
        run: shellcheck scripts/fetch-upstream scripts/ci-local evals/exec/bin/gh
      - name: Hook tests
        run: tests/run-bats --jobs tests/hooks
      - name: Hook shape over fixture projects
        run: bash tests/hook-shape.sh
      - name: Shellcheck hooks and kern scripts
        run: shellcheck -x -S warning hooks/lib/*.sh hooks/guards/*.sh hooks/session-start hooks/subagent-start hooks/prompt-submit hooks/pre-tool-use scripts/kern-* tests/hook-shape.sh tests/run-bats tests/helpers/common.bash
      - name: Shellcheck every bash script
        run: find scripts skills evals/exec/bin evals/exec/hooks -type f \( -name '*.sh' -o ! -name '*.*' \) -print0 | xargs -0 shellcheck -x -S warning
      - name: Seeded-diff set
        run: node scripts/seeded-diffs.mjs
  # macOS minutes cost the most: this job runs on demand and once a week.
  macos:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install bats and shellcheck
        run: brew install bats-core shellcheck
      - name: Unit tests
        run: node --test 'tests/**/*.test.mjs'
      - name: Lint skills
        run: node scripts/lint-skills.mjs
      - name: Routing evals
        run: node scripts/route-eval.mjs
      - name: Script tests under /bin/bash 3.2 and BSD awk
        run: tests/run-bats --jobs tests/scripts
      - name: Hook tests under /bin/bash 3.2
        run: tests/run-bats --jobs tests/hooks
      - name: Hook shape over fixture projects
        run: bash tests/hook-shape.sh
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.296
      - name: Add the repo as a marketplace
        run: claude plugin marketplace add ./
      - name: List marketplaces
        run: claude plugin marketplace list
      - name: Install kern
        run: claude plugin install kern@kern --scope user
